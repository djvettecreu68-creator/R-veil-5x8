                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, 12, 0, 80);
                  l.addView(t);

                  l.addView(bouton("Répéter " + min + " min", "#5F8298", SonnerieService.REPETER));
                  l.addView(bouton("Arrêter", "#E8692A", SonnerieService.ARRETER));
                  setContentView(l);
              }

              private Button bouton(String texte, String couleur, String action) {
                  Button btn = new Button(this);
                  btn.setText(texte);
                  btn.setTextSize(24);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.WHITE);
                  btn.setBackgroundColor(Color.parseColor(couleur));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 180);
                  p.setMargins(0, 24, 0, 0);
                  btn.setLayoutParams(p);
                  btn.setOnClickListener(v -> {
                      startService(new Intent(this, SonnerieService.class).setAction(action));
                      finish();
